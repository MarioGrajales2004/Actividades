<head>

    <title>Ejercicio 15 - Objetos</title>

<body>
    <h1>Registro de Estudiantes</h1>

    <label for="nombre">Nombre del estudiante:</label>
    <input type="text" id="nombre">
    <br><br>

    <label for="calificacion">Calificacion:</label>
    <input type="number" id="calificacion">
    <br><br>

    <button onclick="agregarEstudiante()">Agregar estudiante</button>
    <button onclick="calcular()">Calcular</button>
    <br><br>

    <hr>
    <h2>Resultados</h2>

    <label for="promedio">Calificacion promedio:</label>
    <input type="text" id="promedio" readonly>
    <br><br>

    <label for="mejor">Mejor estudiante:</label>
    <input type="text" id="mejor" readonly>
    <br><br>

    <label for="peor">Peor estudiante:</label>
    <input type="text" id="peor" readonly>

</body>
